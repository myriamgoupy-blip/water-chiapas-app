[theme]
base = "light"
primaryColor = "#1f6fb2"
backgroundColor = "#F2F5F8"
secondaryBackgroundColor = "#E7EDF3"
textColor = "#1E2433"
linkColor = "#1f6fb2"
borderColor = "#D3DCE6"
showWidgetBorder = true
font = "sans-serif"
headingFont = "Bricolage Grotesque, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "full"
metricValueFontWeight = 700
dataframeHeaderBackgroundColor = "#E7EDF3"
chartCategoricalColors = ["#1f6fb2", "#2f8f5b", "#d49a1e", "#C2185B", "#5A6378"]
blueColor = "#1f6fb2"
greenColor = "#2f8f5b"
redColor = "#C2185B"
orangeColor = "#d49a1e"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-latin-800-normal.woff2"
weight = 800
style = "normal"

[server]
headless = true
enableStaticServing = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
